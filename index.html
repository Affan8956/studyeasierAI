
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyEasierAI - Your Academic Powerhouse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Removed html2pdf as we are switching to native print -->
    
    <!-- KaTeX for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0d0d0d;
        color: #f1f5f9;
        margin: 0;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #27272a;
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #3f3f46;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fadeIn {
        animation: fadeIn 0.4s ease-out forwards;
      }

      /* KaTeX Custom Overrides */
      .katex-display {
        margin: 1.5em 0;
        padding: 1em;
        background: rgba(16, 185, 129, 0.03);
        border-radius: 1rem;
        border: 1px solid rgba(16, 185, 129, 0.1);
        overflow-x: auto;
        overflow-y: hidden;
      }
      .katex {
        font-size: 1.1em;
        color: #10b981; /* Emerald-500 for math */
      }
      
      /* 3D Flip Card Utilities */
      .perspective-1000 {
        perspective: 1000px;
      }
      .transform-style-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        -webkit-backface-visibility: hidden; /* Safari */
        backface-visibility: hidden;
      }
      .rotate-y-180 {
        transform: rotateY(180deg);
      }

      /* PRINT / EXPORT PDF STYLES */
      .print-only { display: none !important; }

      @media print {
        @page { margin: 20mm; size: auto; }
        
        /* Reset Body to White Paper Mode */
        body, html, #root, main {
          background-color: #ffffff !important;
          color: #000000 !important;
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: visible !important;
          height: auto !important;
        }

        /* Hide UI Elements */
        .no-print, 
        nav, 
        aside, 
        button, 
        input, 
        .sidebar, 
        header.no-print-header,
        .auth-container { 
          display: none !important; 
        }

        /* Show Print-Specific Content */
        .print-only { display: block !important; }

        /* Typography Overrides for Print */
        h1, h2, h3, h4, h5, h6 {
          color: #000000 !important;
          page-break-after: avoid;
        }
        p, li, span, div {
          color: #1f2937 !important; /* Dark Gray for readability */
        }
        
        /* Make Math Black */
        .katex { color: #000000 !important; }
        .katex-display {
          background: transparent !important;
          border: 1px solid #eee !important;
        }

        /* Layout Fixes */
        .summary-print-container {
          background: white !important;
          border: none !important;
          box-shadow: none !important;
          padding: 0 !important;
          margin: 0 !important;
          max-width: 100% !important;
        }

        /* Ensure links are readable */
        a { text-decoration: underline; color: #2563eb !important; }
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.39.7",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
